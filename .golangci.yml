# The mechanical reviewer.
#
# This project has no second author and the owner does not read the code, so
# the only readers are the compiler, the tests and this. That is why a linter
# is worth its maintenance here and would not be in a project with review.
#
# The set is narrow on purpose. A linter that reports two hundred things gets
# switched off within a month, and switching it off is worse than never having
# had it, because the day it goes quiet nobody notices. Every entry below
# answers a failure this project can actually have, and every entry was
# measured against this tree before it was switched on.
#
# What is NOT here, and why, is the more useful half of this file. It is
# recorded in the exclusions and in the comment blocks below, because a rule
# left out silently is indistinguishable from a rule nobody thought of.

version: "2"

linters:
  # Nothing runs unless it is named. The default set moves between releases,
  # and a guard whose contents change when somebody else cuts a release is a
  # guard that reports something different every year for no reason of ours.
  default: none

  enable:
    # An ignored error is the quietest defect there is. This tool exists to
    # argue that silence is the enemy, so ignoring its own failures would be
    # the same mistake one layer down.
    #
    # Measured 2026-08-27 before switching on: 169 findings, of which 137 are
    # fmt.Fprint* writing to stdout or stderr and 12 are in test files. Both
    # groups are excluded below, each for a reason. What is left is 20 places,
    # every one of them read by hand.
    - errcheck

    # Wrapping an error with %v throws away the kind it carried. Exit codes
    # here are a property of the failure travelling from where it happened, so
    # losing the kind loses the exit code - and this tool promises a frozen
    # table of them.
    #
    # Measured 2026-08-27 before switching on: 13 findings, 8 outside test
    # files.
    - errorlint

    # An assignment nobody reads is either a typo or a leftover. Both are cheap
    # to fix now and confusing to read in three years.
    #
    # Measured 2026-08-27 before switching on: zero findings in the whole tree.
    - ineffassign

    # Prose reaches the user through help text and failure messages, and a typo
    # there is a defect in the product rather than in a comment.
    #
    # Measured 2026-08-27: one finding, "trafic" in a guard. Run over the whole
    # directory rather than over Go files it reports two hundred and five,
    # because the internal notes are written in another language and an English
    # dictionary reads them as misspelled English. This runs on Go files only,
    # which is what golangci-lint does by construction, so that fall does not
    # apply here. Worth knowing before anybody points the tool at the tree.
    - misspell

    # A disabling comment with no reason beside it is the shape this project
    # spent a week removing everywhere else. Measured 2026-08-27: one finding,
    # a bare //nolint carrying neither a linter name nor a word about why.
    - nolintlint

    # Measured 2026-08-27 in full, and the measurement is why the exclusion
    # list below is long rather than why the linter is absent: 141 findings,
    # 102 of them in code that actually ships, and ZERO of those a defect.
    # The seven rules switched off below each have a reason. What is left is
    # 54 rules that report nothing today and watch the failures this project
    # could really have - a hardcoded credential, a path escaping an archive,
    # a predictable temporary name, a listener on every interface.
    - gosec

    # A closed set of values with a switch that forgot one is the defect
    # QUALITY.md section 5 calls "a format added halfway". This project runs on
    # closed sets - audit.Kind, format.PropertyKind, format.Fidelity and four
    # more - so the switch that misses a new one is a real shape here.
    #
    # Measured 2026-08-27: 12 findings raw, 3 once a switch with a default is
    # taken as complete and the toolkit's own key enum is left out. All three
    # were read and all three were correct, so each is now named explicitly
    # rather than silenced - the code says the case was considered.
    - exhaustive

  # misspell deliberately has no settings block. Its locale accepts only US or
  # UK, and choosing either turned out to fight the product: NO_COLOR is a
  # standard environment variable and --no-color is our own flag, so a rule
  # preferring colour would demand renaming a public contract to satisfy a
  # dictionary. Leaving the key out reports real misspellings and stays out of
  # the argument between two spellings of English.
  #
  # Written as a comment rather than as locale with an empty value, because an
  # empty value is refused by the schema.

  # What is deliberately NOT enabled here, with the measurement behind each:
  #
  #   staticcheck, govet, unused - all three already run, and running them
  #   again here would be a second copy that answers a DIFFERENT question.
  #   Measured 2026-08-27: staticcheck under this tool does not honour the
  #   //lint:ignore directive in internal/engine/names.go, so a refusal that
  #   carries its reason in the code would be reported anyway. It also adds
  #   fourteen QF1008 findings, from a family the pinned staticcheck does not
  #   run. govet here carries analysers that go vet does not. Same names, other
  #   gates. The dependency guard in ci.yml keeps them apart.
  #
  #   unused is inside the pinned staticcheck already. Proven rather than
  #   assumed on 2026-08-27: a function nobody calls was put into internal/core
  #   and staticcheck reported it as U1000.
  settings:
    exhaustive:
      # A switch with a default has said what it does about everything else.
      default-signifies-exhaustive: true
      # fyne.KeyName has 70 members, so a switch on a keystroke would have to
      # list every key on the keyboard to satisfy this. Somebody else's enum,
      # and not one we can be complete about.
      ignore-enum-types: "KeyName$"

    gosec:
      # Every entry is a measurement, not a preference. The count beside each
      # is how many findings it produced on 2026-08-27, in code that ships.
      excludes:
        # 67. Integer conversions. The nine that could carry a file size into
        # a four byte field were read one by one: all nine are in wav, png,
        # ico and bmp, and all four formats check a ceiling in Plan before the
        # number reaches the conversion. The rest are byte(v >> 56) and its
        # kin, where truncation is the point. And the class this rule aims at
        # is watched better elsewhere: TestAFormatRefusesASizeItCannotDescribe
        # asks format.All(), so a format added tomorrow is covered without
        # anybody writing anything down.
        - G115
        # 18. Unhandled errors, which is errcheck's question and errcheck is
        # enabled above. Two linters answering it means two exclusion lists to
        # keep in step.
        - G104
        # 8. Reading a file from a variable path. That is what this tool IS.
        # The protection is elsewhere and it is doubled: core.Boundary plus two
        # layers of path checking, each with its own guard.
        - G304
        # 4. unsafe.Pointer in core/diskspace_windows.go, which is the only way
        # to ask Windows how much room is left.
        - G103
        # 4. File and directory permissions. This tool exists to produce files
        # somebody else's CI will read. 0600 would be a defect in the product
        # rather than a fix.
        - G301
        - G302
        # 1. math/rand in core/seed.go. That is the foundation of the product -
        # the same recipe and seed have to give the same bytes, on every
        # machine, for years. crypto/rand would destroy it.
        - G404

    errcheck:
      # Writing to stdout or stderr. There is nothing to recover from and
      # nowhere to report it: the failure of a write to stdout cannot be
      # announced on stdout. Owner's decision, 2026-08-27, after measuring that
      # this is 137 of the 169 findings - a linter reporting those gets
      # switched off, and switching it off costs the other 32.
      exclude-functions:
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln

  exclusions:
    paths:
      # tools/ holds internal scripts and measurement probes and is excluded
      # from the repository, so CI never sees it. Without this line the linter
      # reports eighteen findings here that no CI run can reproduce, which is
      # the "green there, red here" split this project has already paid for
      # once over a compiler version.
      - tools
    rules:
      # A test helper reports through t rather than through a returned error,
      # so a Close it does not check has nowhere to go either. The same
      # exclusion the sister project arrived at, for the same reason.
      - path: _test[.]go
        linters: [errcheck]
      # gosec on test files reports 57 more findings, almost all of them about
      # the permissions of files a guard writes into its own temporary
      # directory. Measured 2026-08-27: 3 findings outside test files, 60
      # including them.
      - path: _test[.]go
        linters: [gosec]

issues:
  # Both limits default to something other than zero, and that default makes
  # this gate report a number that is not a number. Measured 2026-08-27: the
  # first run over this tree reported fifty five findings where there were two
  # hundred and twenty five. Somebody fixes the fifty five, the run goes green,
  # and the next change brings back another fifty five from the same pile.
  max-issues-per-linter: 0
  max-same-issues: 0

formatters:
  enable:
    # Already a step in the test job, kept here so a person running the linter
    # by hand gets the same answer CI gets.
    - gofmt
