name: Release

# Nothing here publishes by itself.
#
# A release happens when the owner pushes a tag, and that push is the command -
# his instruction of 2026-08-19. Running this by hand from the Actions tab
# builds every binary and attaches them to the run instead, so the whole
# pipeline can be tried without a release existing and without a tag being
# spent. The publish job below is the only one that writes anything to the
# repository, and it is fenced off behind the tag.
#
# The release is created as a DRAFT. The tag starts it, the owner still presses
# publish, and until he does nobody can download a half correct release. Drop
# --draft in the publish step to have a tag go straight out.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

# Read only by default. The one job that needs to write says so itself.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  # The same pin CI carries. A release built on a different toolchain than the
  # one the byte stability guards ran under is a release nobody measured.
  GO_VERSION: "1.26.7"

jobs:
  check:
    name: the tree is green and the tag agrees with the code
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      version: ${{ steps.version.outputs.version }}
    env:
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: test
        # A release built from a red tree is the one kind of release that
        # cannot be taken back, because the binaries are already on somebody's
        # disk. This is the same command CI runs.
        run: go test ./... -count=1

      - name: what version the code says
        id: version
        # Asked of the program rather than read out of the source, so this
        # cannot drift from what a manifest will record.
        run: |
          set -euo pipefail
          version="$(go run ./cmd/tfg version)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "the code says $version"

      - name: the tree was green on this exact commit
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        # This workflow builds and publishes. It does run the suite above, but
        # the suite is not the whole of CI - the linters, the scanners, the
        # coverage gate and the reference tools all live in the CI workflow and
        # none of them runs here. Without this, the only thing standing between
        # a red tree and a published release is somebody remembering.
        #
        # 🔴 Asked BY NAME rather than as "were all the checks green". A query
        # for every check answers about whatever happened to report, so a
        # workflow that never ran reads exactly like one that passed.
        run: |
          set -euo pipefail
          verdict="$(gh run list --workflow=CI --commit="${GITHUB_SHA}" \
            --limit 1 --json conclusion --jq '.[0].conclusion // "never ran"')"
          echo "CI on ${GITHUB_SHA}: ${verdict}"
          if [ "$verdict" != "success" ]; then
            echo "The CI workflow on this commit says: ${verdict}."
            echo "A release is built from a commit CI has passed, so push the commit,"
            echo "wait for CI, and tag it only then."
            exit 1
          fi

      - name: the changelog is closed for this version
        if: startsWith(github.ref, 'refs/tags/')
        # A release page points at the changelog, and a changelog whose section
        # for this version does not exist points back at nothing. The other
        # half matters more: entries left under Unreleased are changes that went
        # out without being described, and nobody notices until the next release
        # inherits them.
        run: |
          set -euo pipefail
          version="${{ steps.version.outputs.version }}"
          if ! grep -q "^## \[${version}\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no section for ${version}."
            echo "Move what is under [Unreleased] into a dated section for this version first."
            exit 1
          fi
          # Everything between [Unreleased] and the next version heading. A
          # heading of its own with nothing under it is what "closed" means.
          left="$(awk '/^## \[Unreleased\]/{f=1;next} /^## \[/{f=0} f' CHANGELOG.md | grep -c '[^[:space:]]' || true)"
          if [ "$left" != "0" ]; then
            echo "CHANGELOG.md still has ${left} line(s) under [Unreleased]."
            echo "Those are changes that would go out undescribed. Move them into ${version}."
            exit 1
          fi
          echo "changelog is closed for ${version}"

      - name: the tag says the same as the code
        if: startsWith(github.ref, 'refs/tags/')
        # The version lives in internal/version and only the owner raises it -
        # immutable rule 12, and under it a major bump is a statement about
        # file hashes in other people's CI. A tag that disagrees with the code
        # would put one number in the release page and another one in every
        # manifest the release writes, and the manifest is the copy that turns
        # up months later attached to somebody's failing test.
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#v}"
          code="${{ steps.version.outputs.version }}"
          if [ "$tag" != "$code" ]; then
            echo "The tag is ${GITHUB_REF_NAME} and internal/version says ${code}."
            echo "Raise the version in the code first, commit it, then tag that commit."
            exit 1
          fi
          echo "tag and code agree on ${code}"

  cli:
    name: command line binaries
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # The command line binary has no C in it and no graphics toolkit, so one
      # runner cross compiles the lot. That is not a shortcut: it is the same
      # property the dependency guard exists to keep, and building all six from
      # one place is how it stays visible if it ever stops being true.
      CGO_ENABLED: "0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: build and package every target
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          mkdir -p dist

          # Go calls it darwin and almost nobody else does. The name on a
          # download is read by somebody deciding whether it is the file for
          # their machine, and "darwin" asks them to already know - the owner's
          # point on 2026-08-20. The GOOS stays darwin, because that is what
          # the compiler is told. Only the label a person reads changes.
          friendly() {
            case "$1" in
              darwin) echo "macos" ;;
              *) echo "$1" ;;
            esac
          }

          # No darwin/amd64. Intel Macs are not supported, decided by the owner
          # on 2026-08-20 - Apple silicon only.
          for target in \
            windows/amd64 windows/arm64 \
            linux/amd64 linux/arm64 \
            darwin/arm64
          do
            os="${target%/*}"
            arch="${target#*/}"
            label="$(friendly "$os")"

            work="$(mktemp -d)"
            binary="tfg"
            if [ "$os" = "windows" ]; then
              binary="tfg.exe"
            fi

            # -trimpath keeps the build machine's directory names out of the
            # binary. On a public release that is a privacy line as much as a
            # reproducibility one.
            GOOS="$os" GOARCH="$arch" go build -trimpath -o "${work}/${binary}" ./cmd/tfg

            # The notices travel with the binary because their licences require
            # it - see THIRD-PARTY-NOTICES.md, which says so itself. The licence
            # and the readme go along for the person who downloaded an archive
            # and nothing else.
            # macOS gets a .app bundle, and it is not decoration: a bare binary
            # cannot carry a notarisation ticket at all, so Gatekeeper rejects
            # it even after it is signed and notarised. Measured 2026-08-28.
            # A symlink goes in beside it, so a person still types ./tfg.
            if [ "$os" = "darwin" ]; then
              .github/scripts/make_app_bundle.sh \
                "${work}" "${binary}" "com.donislawdev.tfg" "${version}"
            fi

            cp LICENSE THIRD-PARTY-NOTICES.md README.md "${work}/"

            base="tfg_${version}_${label}_${arch}"
            if [ "$os" = "windows" ]; then
              (cd "${work}" && zip -q -r "${GITHUB_WORKSPACE}/dist/${base}.zip" .)
            else
              tar -czf "dist/${base}.tar.gz" -C "${work}" .
            fi
            echo "packaged ${base}"
          done

          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: cli
          path: dist/*
          if-no-files-found: error

  gui:
    name: window binary on ${{ matrix.os }}
    needs: check
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      # One system failing should not throw away the binaries that did build.
      # A release missing one platform is a decision the owner can make. A
      # release missing all of them because one runner was busy is not.
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
          # Apple silicon only. macos-26-intel was here for one release and was
          # measured working, so this is a decision rather than a limitation:
          # the owner does not support Intel Macs, so nothing is built for them
          # and nothing pretends to be.
          - macos-latest
    env:
      # The window reaches OpenGL through C, so this one cannot be cross
      # compiled the way the command line binary is. Each system builds its
      # own, which is also the first time this project has built a real
      # windowed binary anywhere but the owner's machine.
      CGO_ENABLED: "1"
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: graphics and windowing headers
        if: runner.os == 'Linux'
        # Taken from the toolkit's own CI rather than from a list somebody
        # remembered. No GitHub runner carries these by default, and without
        # them the toolkit's app package does not compile at all.
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgl1-mesa-dev \
            libwayland-dev \
            libx11-dev \
            libxkbcommon-dev \
            xorg-dev

      - name: build and package
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          os="$(go env GOOS)"
          arch="$(go env GOARCH)"
          # Same rename as the command line archives above, and for the same
          # reason: darwin is what the compiler is told, macos is what a person
          # recognises on a download page.
          # if rather than a && chain: under set -e a false test would end the
          # step, and it would end it on every system that is not macOS.
          label="$os"
          if [ "$os" = "darwin" ]; then
            label="macos"
          fi
          work="$(mktemp -d)"
          mkdir -p dist

          if [ "$os" = "windows" ]; then
            # The linker flags come from the file and nowhere else, so that a
            # release and a local build cannot drift. Without them Windows
            # hangs a black console window behind the program. Windows only:
            # the flag names a Windows subsystem and means nothing elsewhere.
            go build -trimpath -ldflags="$(cat .github/gui-ldflags)" \
              -o "${work}/tfg-gui.exe" ./cmd/tfg-gui
          else
            go build -trimpath -o "${work}/tfg-gui" ./cmd/tfg-gui
          fi

          # Same reason as the command line archives: on macOS the ticket has
          # nowhere to attach unless the binary is inside a bundle.
          if [ "$os" = "darwin" ]; then
            .github/scripts/make_app_bundle.sh \
              "${work}" "tfg-gui" "com.donislawdev.tfg-gui" "${version}"
          fi

          cp LICENSE THIRD-PARTY-NOTICES.md README.md "${work}/"

          base="tfg-gui_${version}_${label}_${arch}"
          if [ "$os" = "windows" ]; then
            (cd "${work}" && 7z a -tzip -bso0 "${GITHUB_WORKSPACE}/dist/${base}.zip" .)
          else
            tar -czf "dist/${base}.tar.gz" -C "${work}" .
          fi
          echo "packaged ${base}"
          ls -l dist

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: gui-${{ matrix.os }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish the release
    needs: [check, cli, gui]
    # The only job that writes anything, and the only one fenced behind a tag.
    # Running this workflow by hand stops before here on purpose.
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      # The two the attestation steps need and nothing else grants. id-token
      # mints the short lived OIDC token that signs the statement, attestations
      # writes the result to this repository's store. A release without them
      # would still publish - it would just publish nothing anybody can check.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
        with:
          path: incoming
          merge-multiple: true

      - name: what is inside what we are publishing
        # The bill of materials, generated from internal/legal - the reviewed
        # list of what this project ships - with the versions read from the
        # build. Not from a scan of the artefact: measured 2026-08-27, a scan of
        # the window binary names every module with an exact version and
        # attaches a licence to one of thirty.
        #
        # The tag seeds the document namespace, so re-running this workflow on
        # one tag produces the same URI rather than a fresh random one nobody
        # can correlate.
        run: |
          set -euo pipefail
          version="${{ needs.check.outputs.version }}"
          go run ./internal/legal/cmd/sbom \
            -seed "${GITHUB_REF_NAME}" \
            -o "incoming/tfg_${version}.spdx.json"
          echo "SBOM=incoming/tfg_${version}.spdx.json" >> "$GITHUB_ENV"

      - name: one list of what this build produced
        # build.sha256 rather than SHA256SUMS.txt, and the difference is the
        # whole point of this phase. These are the bytes the RUNNER made. Three
        # of the archives get a signature on the maintainer's machine, which
        # changes them, so the list a user checks is written there, over what
        # they will actually download. This one exists so the statement below
        # names exactly what was built.
        run: |
          set -euo pipefail
          cd incoming
          sha256sum -- * > build.sha256
          cat build.sha256

      # WHO built it, and FROM WHAT. This says the files came out of this
      # repository, from this commit, through this workflow, on a GitHub hosted
      # runner - signed with a short lived identity and recorded in a public
      # log. A user checks it with one command:
      #
      #     gh attestation verify tfg_<version>_linux_amd64.tar.gz \
      #        -R donislawdev/TestingFilesGenerator
      #
      # It is a different question from a code signature, which is why both are
      # worth having: a signature says who vouches for the file, provenance says
      # which source and which build produced it. A stolen key cannot forge
      # this, and a fork cannot claim to be this repository.
      #
      # subject-checksums rather than a glob: the file it reads is the one the
      # release publishes, so the statement covers exactly what is on the page,
      # under the names people download.
      #
      # 🔴 When signing arrives, this moves. A signature changes the bytes, and
      # a statement about the wrong bytes verifies against nothing - so the
      # signed archive gets its own attestation after the signing ritual, and
      # this one stays here describing what this workflow actually built.
      - name: attest what this build produced
        id: provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: incoming/build.sha256

      - name: keep the statement with the build
        # The bundle travels with the artefact rather than to the release page.
        # Five of the eight archives are the finished article - nothing signs a
        # Linux or a macOS build here - so for those this statement describes
        # the bytes a user will hold. For the three Windows archives it
        # describes what the runner made before a person signed it, which is
        # true and is not what anybody downloads.
        run: cp "${{ steps.provenance.outputs.bundle-path }}" incoming/build.provenance.sigstore.json

      - name: notes
        run: |
          set -euo pipefail
          {
            echo "Generate test files, and know how the system under test should react to them."
            echo
            echo "## What to download"
            echo
            echo "- \`tfg_*\` is the command line. It carries no graphics toolkit and no network stack."
            echo "- \`tfg-gui_*\` is the desktop window. Same engine, same features."
            echo
            echo "Match the file to your system and architecture. Check what you downloaded against"
            echo "\`SHA256SUMS.txt\`."
            echo
            echo "## Signing"
            echo
            echo "**Windows binaries are signed.** The signature is on the program inside the zip,"
            echo "carries a timestamp, and names \`Open Source Developer Dominik Babiarz\`, issued by"
            echo "Certum. Windows checks it when you run the program."
            echo
            echo "**macOS binaries are signed and notarised by Apple.** The program lives inside"
            echo "\`tfg.app\` or \`tfg-gui.app\`, with a link called \`tfg\` or \`tfg-gui\` next to it, so"
            echo "you can still type \`./tfg\`. macOS opens them without complaining, and without"
            echo "asking the network, because the notarisation ticket travels inside the bundle."
            echo
            echo "> Keep the \`.app\` and the link together. A copy of the program taken out of the"
            echo "> bundle on its own is refused, because the signature covers the bundle."
            echo
            echo "**Linux binaries are not signed.** Linux says nothing about that, but you may"
            echo "need \`chmod +x\`."
            echo
            echo "## What you can check without trusting this page"
            echo
            echo "What is inside any of these files, signed when the release was made:"
            echo
            echo "\`\`\`"
            echo "gh attestation verify <the file you downloaded> -R ${GITHUB_REPOSITORY} \\"
            echo "   --predicate-type https://spdx.dev/Document"
            echo "\`\`\`"
            echo
            echo "The predicate type has to be given. \`gh\` asks for build provenance unless told"
            echo "otherwise, and that is a different statement - see below."
            echo
            echo "Where a **Linux** archive came from. These are exactly the bytes the build"
            echo "produced, so the build's own statement still describes them:"
            echo
            echo "\`\`\`"
            echo "gh attestation verify <the file you downloaded> -R ${GITHUB_REPOSITORY}"
            echo "\`\`\`"
            echo
            echo "That one does not answer for a **Windows or macOS** archive, and deliberately: a"
            echo "person signed those on their own machines after the build, so the bytes are no"
            echo "longer the bytes the runner made. What answers for them is the signature itself -"
            echo "Authenticode on Windows, and on macOS:"
            echo
            echo "\`\`\`"
            echo "spctl -a -vv tfg.app          # what Gatekeeper thinks of it"
            echo "xcrun stapler validate tfg.app  # that the ticket is really in the file"
            echo "\`\`\`"
            echo
            echo "The \`.spdx.json\` file lists every library and every font compiled into these"
            echo "binaries, with its licence. The \`.sigstore.json\` files are the statements"
            echo "themselves, so both commands also work offline with \`--bundle\`."
            echo
            echo "## Everything that changed"
            echo
            echo "See [CHANGELOG.md](CHANGELOG.md)."
          } > notes.md
          cat notes.md

      - name: open the draft, with nothing in it yet
        env:
          GH_TOKEN: ${{ github.token }}
        # 🔴 No assets. This phase does not publish archives and does not write
        # the checksums a user reads, because these are not the bytes a user
        # gets: three of them are signed afterwards on the machine that holds
        # the card. An unsigned executable on a public release page - even for
        # a quarter of an hour - is an executable somebody downloads.
        #
        # A draft, so the tag starts the release and a person finishes it. A tag
        # whose name carries a hyphen - v0.2.0-rc1 - is marked a prerelease.
        run: |
          set -euo pipefail
          flags=(--draft --title "${GITHUB_REF_NAME}" --notes-file notes.md)
          case "${GITHUB_REF_NAME}" in
            *-*) flags+=(--prerelease) ;;
          esac
          gh release create "${GITHUB_REF_NAME}" "${flags[@]}"
          echo "drafted ${GITHUB_REF_NAME}, empty on purpose"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        # The build, handed to the machine with the card. This is the seam
        # between where builds belong and where signatures belong, and the name
        # is what the signing script asks for.
        with:
          name: unsigned-build-${{ github.ref_name }}
          path: incoming/*
          if-no-files-found: error

      - name: what happens next
        run: |
          set -euo pipefail
          echo "Built, attested, and opened as an EMPTY DRAFT."
          echo
          echo "Nothing is published yet. On the machine with the card, with the Mac awake:"
          echo
          echo "    python .github/scripts/sign_release.py ${GITHUB_REF_NAME} --macos-host user@mac"
          echo
          echo "That verifies this build's provenance before touching it, signs the three"
          echo "Windows binaries with the card, hands the two macOS archives to the Mac to be"
          echo "signed, notarised and stapled, writes SHA256SUMS.txt over what it made, uploads"
          echo "everything to the draft and asks attest-release.yml for the statement about the"
          echo "signed bytes. Then read the draft and publish it."
          echo
          echo "It refuses without a Mac rather than publishing five signed archives and two"
          echo "that Gatekeeper will turn away."
