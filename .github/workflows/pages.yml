name: Site

# The project website, published from web/public.
#
# This runs after CI rather than beside it, and that is the whole design. The
# pages under web/public are generated from the program - the format table, the
# smallest file of each format, the exit codes, the version, the download
# matrix - and TestTheSiteSaysWhatTheToolSays in CI compares them against what
# the program renders right now. Publishing on push would race that check and
# could put a stale page up while CI was still going red about it.
#
# So the site goes out only after CI has passed on main, for the exact commit
# CI passed on, and only while that commit is still the tip of main. A red
# suite means the site does not move. The jobs on macOS are left out of that
# question (O371): GitHub cancelled them again and again for want of a runner,
# each time holding the site back for hours, and nothing the site shows comes
# from macOS. The ci job below asks, .github/scripts/site_gate.py answers.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  GO_VERSION: "1.27.4"

# One deployment at a time, and a newer commit wins. Cancelling a running
# deployment mid-flight would be worse than letting it finish, so in-progress
# is left alone.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  # Whether CI passed on this commit, macOS aside, and whether the commit is
  # still the tip of main. It reads the jobs of the run that triggered this one
  # and holds nothing but read access. A verdict of no is an answer, not a
  # failure, so it leaves this job green and the jobs after it skipped. A script
  # that cannot judge turns it red, so a broken gate is seen.
  ci:
    name: CI passed, macOS aside
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      publish: ${{ steps.verdict.outputs.publish }}
    steps:
      # The script comes from main as it is now, never from the commit being
      # judged, so nothing a branch carries runs here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: read the jobs of the CI run and judge them
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          # A dispatch is a person asking on purpose, with no CI run to read.
          if [ "$EVENT" = workflow_dispatch ]; then
            echo "publish=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --paginate \
            --jq '.jobs[] | [.name, (.conclusion // "none"), (.labels | join(","))] | @tsv' > "$RUNNER_TEMP/jobs.tsv"
          tip=$(gh api "repos/$GITHUB_REPOSITORY/commits/main" --jq .sha)
          code=0
          python3 .github/scripts/site_gate.py "$RUNNER_TEMP/jobs.tsv" "$HEAD_SHA" "$tip" || code=$?
          case "$code" in
            0) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            3) echo "publish=false" >> "$GITHUB_OUTPUT"
               echo "::notice::The site does not move for $HEAD_SHA. The lines above say why." ;;
            *) exit "$code" ;;
          esac

  # The files of the sample files page are not in the repository. The recipe
  # beside the page makes them with the tfg of this commit, and every one is
  # checked against the SHA256SUMS the page was rendered with before it may go
  # out, so the sums a visitor reads are the sums of the bytes they download.
  # A job of its own, with nothing but read access, because it builds and runs
  # repository code and the job that deploys holds pages: write.
  samples:
    needs: ci
    if: >-
      needs.ci.outputs.publish == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The same commit the publish job checks out, for the same reason.
      #
      # CodeQL reports this checkout as actions/untrusted-checkout/medium. That
      # query flags every checkout of a workflow_run head_sha in a job without
      # write access, and by design it does not read the job's if. The if above
      # lets only a push to main of this repository, or a person who can
      # dispatch, reach this step, so the commit is never a fork's. Giving the
      # job write access would move it under the queries that do read the if,
      # which is the wrong trade for a job that runs repository code.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: make the sample files and check them against the page
        env:
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail
          go build -tags "$(cat .github/build-tags)" -o "$RUNNER_TEMP/tfg" ./cmd/tfg
          "$RUNNER_TEMP/tfg" generate web/samples/samples.yaml --out web/public/samples
          "$RUNNER_TEMP/tfg" tool checksum-check web/public/samples/SHA256SUMS

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sample-files
          path: web/public/samples
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [ci, samples]
    # Read access only. It uploads the site, and the deploy job after it is the
    # one that publishes. configure-pages only reads the Pages settings here.
    permissions:
      contents: read
      pages: read
    # A dispatch is a person asking on purpose. Everything else has to be the
    # ci job saying the tree is good, ON THIS REPOSITORY, for a push.
    #
    # The last two conditions were added on 2026-08-27, the day this project
    # started taking pull requests, and they close a hole that opened with it.
    # This job runs on workflow_run, which fires in the base repository with the
    # base repository's permissions - and the deploy job after it, which runs
    # only when this one does, holds pages: write. CI runs on
    # pull_request, and the branches filter above matches the branch NAME of the
    # run that triggered it, which for a fork is a name the fork chose. A fork
    # whose branch is called main, opening a pull request that passes CI, would
    # otherwise reach this job, and the two jobs publish web/public to the
    # project website.
    #
    # Nothing here executes repository code, so the exposure was defacement
    # rather than anything reaching a secret. That is still not a thing to leave
    # open once anyone can open a pull request.
    if: >-
      needs.ci.outputs.publish == 'true' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The rule below is right about the shape and the condition above is the
      # answer to it: this job only runs for a push, on this repository, so the
      # head_sha it checks out cannot come from a fork.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          # The commit CI passed on, not whatever main happens to be now. On a
          # dispatch there is no such commit, and github.sha is the commit the
          # branch was at when the run started - fixed for the whole run, so a
          # push while the samples job works cannot pair its files with the
          # pages of a newer commit, the way the branch name resolved twice
          # could.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: refuse to publish an empty site
        # A misplaced path here would deploy nothing and take the site down
        # without failing, which is the quiet kind of breakage. The pages are
        # committed, so their absence is a mistake rather than a state.
        run: |
          test -f web/public/index.html
          test -f web/public/sitemap.xml
          test -f web/public/CNAME

      # The sample files the samples job made and checked. Nothing here builds
      # or runs code of the repository.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sample-files
          path: web/public/samples

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: web/public

  # The deployment is a job of its own, after the one that uploaded the site.
  # deploy-pages finds the artifact by its name, and on 2026-11-24 it twice
  # listed the sample-files artifact of the earlier job and not the
  # github-pages one uploaded a moment before in the same job, so both runs
  # failed with every file ready (actions/deploy-pages#451 reports the same,
  # and upload-pages-artifact's artifact id cannot be passed to it instead).
  #
  # The lookup is also asked again, twice, after a wait. A lookup that finds
  # nothing creates no deployment, and asking again in the same job uploads
  # nothing, while re-running the failed job uploads a second github-pages
  # artifact and then fails on finding two.
  #
  # No checkout and nothing of the repository runs here. It needs no if of its
  # own: when the publish job is skipped, this one is too.
  deploy:
    needs: publish
    permissions:
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.third.outputs.page_url || steps.second.outputs.page_url || steps.first.outputs.page_url }}
    steps:
      - id: first
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        continue-on-error: true

      - name: wait before asking again
        if: steps.first.outcome == 'failure'
        run: sleep 30

      - id: second
        if: steps.first.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
        continue-on-error: true

      - name: wait longer before the last try
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        run: sleep 60

      - id: third
        if: steps.first.outcome == 'failure' && steps.second.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.1
