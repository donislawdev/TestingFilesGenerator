name: Site

# The project website, published from web/public.
#
# This runs after CI rather than beside it, and that is the whole design. The
# pages under web/public are generated from the program - the format table, the
# smallest file of each format, the exit codes, the version, the download
# matrix - and TestTheSiteSaysWhatTheToolSays in CI compares them against what
# the program renders right now. Publishing on push would race that check and
# could put a stale page up while CI was still going red about it.
#
# So the site goes out only after CI has passed on main, for the exact commit
# CI passed on. A red suite means the site does not move.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deployment at a time, and a newer commit wins. Cancelling a running
# deployment mid-flight would be worse than letting it finish, so in-progress
# is left alone.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    # A dispatch is a person asking on purpose. Everything else has to be CI
    # saying the tree is good, ON THIS REPOSITORY, for a push.
    #
    # The last two conditions were added on 2026-08-27, the day this project
    # started taking pull requests, and they close a hole that opened with it.
    # This job runs on workflow_run, which fires in the base repository with the
    # base repository's permissions - and it holds pages: write. CI runs on
    # pull_request, and the branches filter above matches the branch NAME of the
    # run that triggered it, which for a fork is a name the fork chose. A fork
    # whose branch is called main, opening a pull request that passes CI, would
    # otherwise reach this job, and this job publishes web/public to the project
    # website.
    #
    # Nothing here executes repository code, so the exposure was defacement
    # rather than anything reaching a secret. That is still not a thing to leave
    # open once anyone can open a pull request.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # The rule below is right about the shape and the condition above is the
      # answer to it: this job only runs for a push, on this repository, so the
      # head_sha it checks out cannot come from a fork.
      # nosemgrep: yaml.github-actions.security.workflow-run-target-code-checkout.workflow-run-target-code-checkout
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The commit CI passed on, not whatever main happens to be now. On a
          # dispatch there is no such commit and the default ref is right.
          ref: ${{ github.event.workflow_run.head_sha || github.ref }}

      - name: refuse to publish an empty site
        # A misplaced path here would deploy nothing and take the site down
        # without failing, which is the quiet kind of breakage. The pages are
        # committed, so their absence is a mistake rather than a state.
        run: |
          test -f web/public/index.html
          test -f web/public/sitemap.xml
          test -f web/public/CNAME

      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d  # v6.0.0

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9  # v5.0.0
        with:
          path: web/public

      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346  # v5.0.0
