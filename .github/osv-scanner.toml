# Exceptions for the OSV scan of the files in this directory. OSV-Scanner reads
# this file for the lockfiles beside it and for no other directory. One advisory
# per entry, and every entry has a date it stops working on.
#
# The rule is to raise what can be raised - pull request #181 fixed thirty
# findings rather than listing them here. An entry belongs here only when no
# version anybody can install has the fix.

# mcp 1.29.0, in requirements-semgrep.txt for the scanner and nothing else.
#
# Every semgrep release, 1.181.0 of 2026-10-14 included, asks for mcp==1.29.0
# exactly, so no set pip can install holds the fixed 1.30.0. Dependabot's own
# security update said the same on 2026-10-15: latest resolvable 1.29.0, lowest
# fixed 1.30.0.
#
# The advisory is about an MCP server over Streamable HTTP keeping its sessions
# without bound. The job runs `semgrep scan` and nothing else, which starts no
# server and listens nowhere, on a runner that lives for one scan.
#
# When semgrep moves to a fixed mcp, Dependabot brings that release as a pull
# request against requirements-semgrep.in, and this entry has nothing left to
# hide - remove it then. If that has not happened by the date below, the weekly
# scan goes red again, which is the reminder.
[[IgnoredVulns]]
id = "GHSA-84m7-p3x7-pcfv"
ignoreUntil = 2026-11-15
reason = "semgrep pins mcp==1.29.0 in every release, and the advisory is about an MCP HTTP server, which semgrep scan never starts"

# opentelemetry-api 1.37.0, in requirements-semgrep.txt for the scanner and
# nothing else.
#
# semgrep 1.180.0 and 1.181.0 both ask for opentelemetry-api~=1.37.0, read
# from their wheels on 2026-10-26, so no set pip can install holds the fixed
# 1.45.1. certifi, found by the same scan, had no such bound and was raised.
#
# The advisory is about TraceState.from_header taking quadratic time on an
# inbound tracestate header - reached through propagate.extract() in the
# instrumentation of a server receiving requests. semgrep scan sends its
# telemetry out and receives no request, on a runner that lives for one scan.
#
# The same date as the entry above, on purpose: both wait on a semgrep that
# moves its pins, and both come back on one reminder.
[[IgnoredVulns]]
id = "GHSA-xcq7-p3pf-p88h"
ignoreUntil = 2026-11-15
reason = "semgrep pins opentelemetry-api~=1.37.0 in every release, and the advisory is about parsing an inbound tracestate header in a server, which semgrep scan never runs"

# Three more advisories against mcp 1.29.0, published 2026-11-02, all fixed in
# the same 1.30.0 as the first entry above.
#
# semgrep 1.183.0 of 2026-10-29, the newest, still asks for mcp==1.29.0, so no
# set pip can install holds the fix. Nor can mcp be left out of the install:
# semgrep's command line imports mcp.server.auth.settings when it starts, and
# without the package `semgrep --version` itself fails (measured 2026-11-03 in
# python:3.14-slim with this directory's requirements).
#
# Two are about the MCP client - its HTTP transports following a redirect to
# another host with the request's headers and body, and its fetching of $ref
# addresses a server names in an output schema. The third is about an MCP
# server accepting a bearer token issued for a different resource server. The
# job runs `semgrep scan` and nothing else, which starts neither a client nor
# a server, on a runner that lives for one scan.
#
# The same date as the entries above: all of them wait on a semgrep that moves
# its pin, and all of them come back on one reminder.
[[IgnoredVulns]]
id = "GHSA-5h93-6whr-6q8j"
ignoreUntil = 2026-11-15
reason = "semgrep pins mcp==1.29.0 in every release, and the advisory is about the MCP client following cross-origin redirects, which semgrep scan never starts"

[[IgnoredVulns]]
id = "GHSA-rwrf-2pqf-9j8j"
ignoreUntil = 2026-11-15
reason = "semgrep pins mcp==1.29.0 in every release, and the advisory is about the MCP client fetching server-chosen $ref addresses, which semgrep scan never starts"

[[IgnoredVulns]]
