# The sample files of https://testingfilesgenerator.donislawdev.com/sample-files/
#
# Every file on that page comes from this recipe. Run it and you get the same
# bytes on any machine, which the SHA256SUMS beside the files lets you check:
#
#   tfg generate samples.yaml --out samples
#   tfg tool checksum-check samples/SHA256SUMS
#
# The tables for an import come from the tabular-import preset, so they are
# built first. The files of this recipe follow it, in four groups.

version: 1
seed: 2026
extends: preset:tabular-import

targets:
  # One file of every format, 1 MB each, that opens in the software that owns it.
  - id: sample_avif
    format: avif
    size: 1mb
    name: sample.avif
    group: formats
    expected: accept
