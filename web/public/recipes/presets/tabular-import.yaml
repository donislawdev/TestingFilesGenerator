# Generated by: tfg preset eject tabular-import
# Does my table import survive what real tools export?
#
# Edit it, commit it, it is an ordinary recipe from here on.

version: 1
targets:
  - id: dialect_default
    format: csv
    count: 1
    size: 65536
    name: default.csv
    group: csv-dialects
    purpose: "The table every other CSV file of this group is compared with, every dialect setting at its default. Your import should take it - if it does not, the fault is not the dialect."
    expected: accept
    properties:
      delimiter: comma
      header: "true"
      line_ending: lf
      quote_style: minimal
  - id: dialect_delimiter_pipe
    format: csv
    count: 1
    size: 65536
    name: delimiter_pipe.csv
    group: csv-dialects
    purpose: "The default table with delimiter set to pipe and nothing else changed. Whether your import takes this dialect is its own choice - check that it reads the table right or refuses it clearly, and never reads half of it."
    expected:
      outcome: unspecified
      reason: none
    properties:
      delimiter: pipe
      header: "true"
      line_ending: lf
      quote_style: minimal
  - id: dialect_delimiter_semicolon
    format: csv
    count: 1
    size: 65536
    name: delimiter_semicolon.csv
    group: csv-dialects
    purpose: "The default table with delimiter set to semicolon and nothing else changed. Whether your import takes this dialect is its own choice - check that it reads the table right or refuses it clearly, and never reads half of it."
    expected:
      outcome: unspecified
      reason: none
    properties:
      delimiter: semicolon
      header: "true"
      line_ending: lf
      quote_style: minimal
  - id: dialect_delimiter_tab
    format: csv
    count: 1
    size: 65536
    name: delimiter_tab.csv
    group: csv-dialects
    purpose: "The default table with delimiter set to tab and nothing else changed. Whether your import takes this dialect is its own choice - check that it reads the table right or refuses it clearly, and never reads half of it."
    expected:
      outcome: unspecified
      reason: none
    properties:
      delimiter: tab
      header: "true"
      line_ending: lf
      quote_style: minimal
  - id: dialect_line_ending_crlf
    format: csv
    count: 1
    size: 65536
    name: line_ending_crlf.csv
    group: csv-dialects
    purpose: The default table with line_ending set to crlf and nothing else changed. Every CSV reader has to cope with it, so a failure here is a fault in the import rather than a choice.
    expected: accept
    properties:
      delimiter: comma
      header: "true"
      line_ending: crlf
      quote_style: minimal
  - id: dialect_header_false
    format: csv
    count: 1
    size: 65536
    name: header_false.csv
    group: csv-dialects
    purpose: "The default table with header set to false and nothing else changed. Whether your import takes this dialect is its own choice - check that it reads the table right or refuses it clearly, and never reads half of it."
    expected:
      outcome: unspecified
      reason: none
    properties:
      delimiter: comma
      header: "false"
      line_ending: lf
      quote_style: minimal
  - id: dialect_quote_style_all
    format: csv
    count: 1
    size: 65536
    name: quote_style_all.csv
    group: csv-dialects
    purpose: The default table with quote_style set to all and nothing else changed. Every CSV reader has to cope with it, so a failure here is a fault in the import rather than a choice.
    expected: accept
    properties:
      delimiter: comma
      header: "true"
      line_ending: lf
      quote_style: all
  - id: dialect_quote_style_none
    format: csv
    count: 1
    size: 65536
    name: quote_style_none.csv
    group: csv-dialects
    purpose: The default table with quote_style set to none and nothing else changed. Every CSV reader has to cope with it, so a failure here is a fault in the import rather than a choice.
    expected: accept
    properties:
      delimiter: comma
      header: "true"
      line_ending: lf
      quote_style: none
  - id: wide_table
    format: csv
    count: 1
    size: 709793
    name: wide.csv
    group: csv-wide
    purpose: "A CSV table with 32768 columns, the most this build writes. A spreadsheet may show only the first 16384 and drop the rest without a word - whether your import refuses such a table, cuts it or takes it whole is its own policy."
    expected:
      outcome: unspecified
      reason: count_limit
    properties:
      columns: "32768"
  - id: sheet
    format: xlsx
    count: 1
    size: 1649371
    name: sheet.xlsx
    group: xlsx-rows
    purpose: "An Excel workbook of 1000 rows and 10 columns, as many as were asked for. Your import should take it whole - it checks that a real spreadsheet of this size is read to its last row."
    expected: accept
    properties:
      columns: "10"
      rows: "1000"
  - id: layout_indented
    format: json
    count: 1
    size: 65536
    name: indented.json
    group: json-layouts
    purpose: "The records as JSON, indented across many lines. Every JSON reader takes it - it checks that the import reads the document as JSON rather than line by line."
    expected: accept
    properties:
      formatting: indented
  - id: layout_minified
    format: json
    count: 1
    size: 65536
    name: minified.json
    group: json-layouts
    purpose: "The records as JSON on one line, with no newline at the end. Every JSON reader takes it - it checks that nothing around the parser, such as a line reader or a log, chokes on one very long line."
    expected: accept
    properties:
      formatting: minified
  - id: layout_record_per_line
    format: json
    count: 1
    size: 65536
    name: record-per-line.json
    group: json-layouts
    purpose: "The records as JSON with one record on each line. Every JSON reader takes it - it checks that the import does not treat each line as a document of its own."
    expected: accept
    properties:
      formatting: record-per-line
